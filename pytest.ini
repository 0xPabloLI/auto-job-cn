[pytest]
# scripts/oneshot/ 是历史实验脚本（调研期一次性验证），其中的 test_* 不是测试，
# 缺依赖会报 collection error —— 不收集。
norecursedirs = .* build dist CVS _darcs {arch} *.egg oneshot
testpaths = scripts
# 每次运行输出最慢 10 条测试耗时（测试性能追踪，配合 CI 的 -n auto 并行与覆盖率门槛）。
addopts = --durations=10
# 集成/E2E 冒烟标记（#40）：需真实账号登录态，CI 默认跳过（ci.yml -m "not integration"），
# 人工触发全量跑法与步骤见 docs/agents/integration-smoke.md
markers =
    integration: 集成/E2E 冒烟（需真实登录态，CI 默认跳过）
