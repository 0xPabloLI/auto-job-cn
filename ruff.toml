# ruff 基线（2026-09-11 引入）：只开真错误类规则，风格类全量规则集对无 linter
# 历史的仓太吵（首轮全量 235 个，精简集 50 个）。升档原则同 kb-pipeline-modules：
# 出现真实需求再扩 select，不预装。运行：python3 -m ruff check scripts/
line-length = 120

[lint]
select = ["E4", "E7", "E9", "F", "N", "C901", "PLR0912", "PLR0915"]

[lint.mccabe]
# 圈复杂度门槛：按 2026-09-15 基线校准（现存最复杂函数 24），新代码不得更糟，
# 存量重构后逐档下调（配合 PLR0912/PLR0915 三道闸）。
max-complexity = 25

[lint.pylint]
max-branches = 30
# 语句数门槛（#39 由 100 降到 75；#44 清掉三个 legacy 单体后降到 50）：#44 物理清理了
# 挂机盲投死代码（batch_apply_v2.apply_round 75 / ChatFirstPlatform.apply 74 / crawl_jds 57，
# 含提取到 _limits.py 的共用品），现存最大函数已低于 50。新函数不得超过。
max-statements = 50

[lint.per-file-ignores]
# 全仓既定模式：脚本以 sys.path.insert(0, ...) 挂载 scripts/ 后再 import 兄弟模块，
# E402（import 不在文件顶）按设计命中，全局忽略。
"scripts/*.py" = ["E402"]
# vulture 白名单文件：裸名字按设计触发 F821，不检查。
"scripts/vulture_whitelist.py" = ["F821"]

[format]
# ruff format（black 兼容）2026-09-15 全仓采纳；与 line-length=120 对齐。
quote-style = "double"
