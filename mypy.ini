[mypy]
# 静态类型检查基线（2026-09-15 引入）。脚本仓无类型注解，先做推断级检查
# （call/arg/union 正确性），升档路径：核心模块先加注解再开 disallow_untyped_defs。
# 3.9 语法兼容性由 ruff（requires-python）负责；mypy 只盯 CI 的 3.12 目标。
python_version = 3.12
exclude = (?x)(oneshot|vulture_whitelist)
ignore_missing_imports = True
no_implicit_optional = True
warn_redundant_casts = True
warn_unused_ignores = True
